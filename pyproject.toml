[project]
name = "dwb-orders"
version = "0.1.0"
description = "Fetch orders from the Digital Waybill API and save each as a JSON file."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Alfonso Arce" }]
dependencies = [
    # The Orders viewer: FastAPI serves its API and its built assets,
    # uvicorn runs it. Nothing else here is a web application.
    "fastapi>=0.115",
    "pdfplumber>=0.11.8",
    "psycopg[binary]>=3.2",
    "rapidfuzz>=3.13.0",
    "tqdm>=4.67",
    "tzdata>=2025.1",
    "usaddress-scourgify>=0.6.0",
    "uvicorn>=0.34",
    "xlsxwriter>=3.2.9",
]

[dependency-groups]
dev = [
    # Starlette's test client, which drives the viewer over HTTP in-process.
    # Starlette prefers httpx2 and says so in a warning; httpx2 needs Python
    # 3.10, and this project still supports 3.9. Revisit with requires-python.
    "httpx>=0.28",
    "pytest>=8.3",
    # The documented pre-push checks (.claude/commands/gitpush.md) run ruff.
    "ruff>=0.16",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The entry points are scripts at the repository root, and dwb/ is imported
# relative to it; this is not an installed package (see [tool.uv] below).
pythonpath = ["."]

[tool.ruff.lint.per-file-ignores]
# FA100 asks for `from __future__ import annotations` so that Optional[X] can
# be written X | None. pydantic resolves these annotations at runtime, and
# X | None raises on the Python 3.9 this project still supports, so the
# viewer's response models stay written with Optional. Revisit if
# requires-python ever moves to 3.10.
"dwb/viewer.py" = ["FA100"]

[tool.uv]
# This is an application, not a distributable package.
package = false
