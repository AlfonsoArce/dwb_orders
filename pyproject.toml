[project]
name = "dwb-orders"
version = "0.1.0"
description = "Fetch orders from the Digital Waybill API and save each as a JSON file."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Alfonso Arce" }]
dependencies = [
    "pdfplumber>=0.11.8",
    "psycopg[binary]>=3.2",
    "rapidfuzz>=3.13.0",
    "tqdm>=4.67",
    "tzdata>=2025.1",
    "usaddress-scourgify>=0.6.0",
    "xlsxwriter>=3.2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    # The documented pre-push checks (.claude/commands/gitpush.md) run ruff.
    "ruff>=0.16",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The entry points are scripts at the repository root, and dwb/ is imported
# relative to it; this is not an installed package (see [tool.uv] below).
pythonpath = ["."]

[tool.uv]
# This is an application, not a distributable package.
package = false
