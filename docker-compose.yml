# Postgres for the Order store, a browser client, the Orders viewer, and the
# poller that keeps the store up to date.
#
# Adminer and the viewer bind to 127.0.0.1 only. Postgres is published on all
# interfaces (DWB_PG_BIND, default 0.0.0.0) so other machines can reach the
# Order store; set DWB_PG_BIND=127.0.0.1 in .env to pull it back to this host
# alone. Anyone who can route to this machine can then attempt authentication,
# so POSTGRES_PASSWORD is the only thing between the network and real customer
# data — keep it long, and keep the port closed at the firewall to everything
# but the hosts that need it. The published Postgres port is 5434 because 5432
# and 5433 are already taken by the TMS and billing databases on this machine.
#
# Adminer is the write-capable tool here, and the viewer is not a security
# boundary while it is running. Adminer connects as `dwb`, which owns every
# table and is one click from destroying the store; the viewer connects as
# `dwb_viewer`, which holds SELECT and nothing else. Both statements are true
# at once. "Read-only viewer" is a property of the viewer, not of this machine.
#
# Database storage is a named Docker volume, never a bind mount. This
# repository lives inside iCloud Drive, and a Postgres data directory under a
# sync daemon gets corrupted.
#
# Settings come from .env (see .env.example):
#   POSTGRES_PASSWORD     the database password, the one place it is written
#   DWB_VIEWER_PASSWORD   the viewer role's password — a *different* secret,
#                         set on the role by hand once (see .env.example)
#   DWB_PG_PORT           host port for Postgres    (default 5434)
#   DWB_PG_BIND           host address Postgres is published on (default
#                         0.0.0.0 — every interface; use 127.0.0.1 for local)
#   DWB_ADMINER_PORT      host port for Adminer     (default 8081)
#   DWB_VIEWER_PORT       host port for the viewer  (default 8082)
#   DWB_POLL_INTERVAL     seconds between fetches   (default 300)
#   DWB_POLL_MAX_PAGES    the poller's catch-up ceiling (default 200)
#   DWB_POLL_FILL_EVERY   fill gaps every Nth run, 0 to never (default 12)
#   DWB_POLL_FILL_DAYS    how far back the gap fill looks (default 90)

services:
  db:
    image: postgres:18
    container_name: dwb-orders-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: dwb_orders
      POSTGRES_USER: dwb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      # Reachable from other machines, not just this one. The container has
      # always listened on *, and pg_hba requires scram-sha-256 for anything
      # that is not container-local, so this line is the whole exposure.
      - "${DWB_PG_BIND:-0.0.0.0}:${DWB_PG_PORT:-5434}:5432"
    volumes:
      # Postgres 18 wants the whole /var/lib/postgresql, not just data/, so
      # that a future pg_upgrade --link stays inside one mount point.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dwb -d dwb_orders"]
      interval: 5s
      timeout: 5s
      retries: 20

  adminer:
    image: adminer:5
    container_name: dwb-orders-adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "127.0.0.1:${DWB_ADMINER_PORT:-8081}:8080"
    depends_on:
      db:
        condition: service_healthy

  viewer:
    build:
      context: .
      dockerfile: Dockerfile
      target: service
    image: dwb-orders-viewer
    container_name: dwb-orders-viewer
    restart: unless-stopped
    environment:
      # The service name and the *internal* port: 127.0.0.1:5434 is the
      # published address on the host, and means nothing in here. This is why
      # the viewer's connection string is its own setting and not DWB_DSN.
      DWB_VIEWER_DSN: postgresql://dwb_viewer@db:5432/dwb_orders
      # Never POSTGRES_PASSWORD. A read-only account authenticating with the
      # owning account's secret is not a second account.
      DWB_VIEWER_PASSWORD: ${DWB_VIEWER_PASSWORD:?set DWB_VIEWER_PASSWORD in .env, and on the role — see .env.example}
    ports:
      - "127.0.0.1:${DWB_VIEWER_PORT:-8082}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # The endpoint answers 200 even when the database is down — that is its
      # job — so this reports whether the *viewer* is working, which is what
      # `docker compose ps` should tell you. Written in Python because the
      # image has no curl, and needs none.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # The poller keeps the Order store current: an incremental fetch every
  # DWB_POLL_INTERVAL seconds, for as long as the stack is up. It replaces
  # running `uv run get_orders.py --incremental` by hand, and it lives here
  # rather than in a host cron or LaunchAgent for two reasons: a LaunchAgent
  # only runs while somebody is logged in, and anything running from the
  # working tree writes its output into iCloud Drive. This writes to the
  # database and to its logs, and to nothing else — no volume, no bind mount,
  # no contact with the synced folder.
  poller:
    build:
      context: .
      dockerfile: Dockerfile
      target: poller
    image: dwb-orders-poller
    container_name: dwb-orders-poller
    restart: unless-stopped
    environment:
      # The service name and the *internal* port, for the same reason the
      # viewer's connection string is its own setting: 127.0.0.1:5434 is the
      # published address on the host and means nothing in here.
      DWB_DSN: postgresql://dwb@db:5432/dwb_orders
      # The poller writes Orders, so it connects as the owning role — unlike
      # the viewer, which must not, and has its own account and its own secret.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Dispatch API credentials. .env never enters an image (see
      # .dockerignore); compose reads it on the host and passes these in.
      DWB_CID: ${DWB_CID:?set DWB_CID in .env}
      DWB_KEY: ${DWB_KEY:?set DWB_KEY in .env}
      DWB_POLL_INTERVAL: ${DWB_POLL_INTERVAL:-300}
      # A ceiling, not a target: --incremental stops at the first Order it
      # already has, so this only does work after the poller has been down.
      # It must never be 1 — see the header comment in poll.sh.
      DWB_POLL_MAX_PAGES: ${DWB_POLL_MAX_PAGES:-200}
      DWB_POLL_OVERLAP_PAGES: ${DWB_POLL_OVERLAP_PAGES:-5}
      # Paging cannot recover an Order it skipped: the hole sits below
      # the watermark it resumes from. So once an hour (12 runs at 300s)
      # the poller asks the store which Order Numbers are missing and
      # requests them by name. The window is in days because that is how
      # the question gets asked — "the last three months" — and 90 days
      # of recent Orders is a few hundred requests at worst, most of
      # which come back 404 for numbers dispatch never issued.
      DWB_POLL_FILL_EVERY: ${DWB_POLL_FILL_EVERY:-12}
      DWB_POLL_FILL_DAYS: ${DWB_POLL_FILL_DAYS:-90}
      DWB_POLL_FILL_LIMIT: ${DWB_POLL_FILL_LIMIT:-500}
      # tqdm draws a progress bar for a terminal that is not there; without
      # this, every run leaves a few hundred redraws in the container log.
      TQDM_DISABLE: "1"
    depends_on:
      db:
        condition: service_healthy
    # A process that logs every five minutes for months will fill a disk if
    # nothing bounds it.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  pgdata:
    name: dwb_orders_pgdata
